[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mncs-forge"
version = "0.1.0a3"
description = "Experimental MNCS-native development and evidence control plane for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "MNCS Contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "filelock>=3.16,<4",
  "jsonschema>=4.23,<5",
  "mcp>=1.29,<2",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.13,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff==0.15.22",
  "types-jsonschema>=4.23",
]

[project.scripts]
mncs-forge = "mncs_forge.cli:main"
mncs-forge-server = "mncs_forge.server:main"
# Temporary compatibility alias for pre-rename installations.  Internal
# family coordination and documentation use `mncs-forge` exclusively.
mncs-forge-mcp = "mncs_forge.server:main"

[project.urls]
Repository = "https://github.com/epi13/mncs-forge"
Issues = "https://github.com/epi13/mncs-forge/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mncs_forge.resources" = ["*.json", "*.md", "native/forge/*.mncs", "native/forge/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mncs_forge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["native: requires the separately checked out and built mncs-language runtime"]
