name: Native Forge integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: mncs-forge
      - uses: actions/checkout@v5
        with:
          repository: epi13/mncs-language
          ref: main
          path: mncs-language
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the checked-out MNCS language runtime
        working-directory: mncs-language
        run: cargo build --locked --release -p mncs-cli
      - name: Test the language repository
        working-directory: mncs-language
        run: cargo test --locked --workspace
      - name: Install Forge with development dependencies
        working-directory: mncs-forge
        run: python -m pip install -e '.[dev]'
      - name: Verify the native Forge lane without skips
        working-directory: mncs-forge
        env:
          MNCS_LANGUAGE_ROOT: ${{ github.workspace }}/mncs-language
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_FORGE_NATIVE_MODE: required
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest -m native --strict-markers -ra
      - name: Build and verify both Forge distributions through native mode
        working-directory: mncs-forge
        env:
          MNCS_LANGUAGE_ROOT: ${{ github.workspace }}/mncs-language
          MNCS_CLI: ${{ github.workspace }}/mncs-language/target/release/mncs
          MNCS_FORGE_NATIVE_MODE: required
        run: |
          python -m build --wheel --sdist
          python scripts/verify-package.py --artifact-dir dist --no-build
